name: Build and Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: npm install
      
    - name: Create build directory
      run: mkdir -p dist
      
    - name: Copy necessary files
      run: |
        cp bundle.cjs dist/
        cp config.json dist/
        cp package.json dist/
        cp README.md dist/
        cp LICENSE dist/
        cp -r build dist/ 2>/dev/null || true
        
    - name: Create release archive
      run: |
        cd dist
        tar -czf ../siteproxy-${{ github.sha }}.tar.gz .
        cd ..
        zip -r siteproxy-${{ github.sha }}.zip dist/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: siteproxy-build
        path: |
          siteproxy-*.tar.gz
          siteproxy-*.zip
        retention-days: 30
