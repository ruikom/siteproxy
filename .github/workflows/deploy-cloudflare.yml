name: Deploy to Cloudflare

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy to Cloudflare Worker
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: npm install
      
    - name: Configure Worker settings
      run: |
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('wrangler.worker.jsonc', 'utf8').replace(/\/\/.*/g, '').replace(/\/\*[\s\S]*?\*\//g, ''));
        config.vars.proxy_url = process.env.PROXY_URL || '';
        config.vars.token_prefix = process.env.TOKEN_PREFIX || '/';
        fs.writeFileSync('wrangler.worker.jsonc', JSON.stringify(config, null, 2));
        "
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        TOKEN_PREFIX: ${{ secrets.TOKEN_PREFIX }}
      
    - name: Deploy to Cloudflare Worker
      run: npm run deploy-cf-worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: npm install
      
    - name: Configure Pages settings
      run: |
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8').replace(/\/\/.*/g, '').replace(/\/\*[\s\S]*?\*\//g, ''));
        config.vars.proxy_url = process.env.PROXY_URL || '';
        config.vars.token_prefix = process.env.TOKEN_PREFIX || '/';
        fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
        "
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        TOKEN_PREFIX: ${{ secrets.TOKEN_PREFIX }}
      
    - name: Deploy to Cloudflare Pages
      run: npm run deploy-cf-page
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
