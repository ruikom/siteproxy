name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: npm install
      
    - name: Create release package
      run: |
        mkdir -p release
        cp bundle.cjs release/
        cp config.json release/
        cp package.json release/
        cp README.md release/
        cp README_english.md release/
        cp LICENSE release/
        cp Dockerfile release/
        cp wrangler.jsonc release/
        cp wrangler.worker.jsonc release/
        cp -r build release/ 2>/dev/null || true
        cp -r docker-node release/ 2>/dev/null || true
        
    - name: Create archives
      run: |
        tar -czf siteproxy-${GITHUB_REF#refs/tags/}.tar.gz -C release .
        cd release && zip -r ../siteproxy-${GITHUB_REF#refs/tags/}.zip . && cd ..
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          siteproxy-*.tar.gz
          siteproxy-*.zip
        body: |
          ## SiteProxy Release
          
          ### 部署方式
          - Cloudflare Pages
          - Cloudflare Workers
          - VPS/云服务器
          - Docker
          
          详细部署说明请查看 [README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
